<div class="viewer" data-theme="dark">
  <header class="viewer-bar">
    <div class="viewer-brand">
      <svg class="viewer-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="15" width="26" height="2.5" rx="1.25" />
        <circle cx="9" cy="16.25" r="4.5" />
        <circle cx="23" cy="16.25" r="4.5" />
      </svg>
      <span class="viewer-name">IonShuttler</span>
      <span class="viewer-product">Viewer</span>
    </div>
    <label class="viewer-choice" hidden>
      <span class="viewer-visually-hidden">View</span>
      <select class="viewer-views"></select>
    </label>
    <span class="viewer-message" role="status"></span>
    <span class="viewer-spacer"></span>
    <label class="viewer-open">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M11 20h2v-9l3.5 3.5 1.4-1.4L12 7.2l-5.9 5.9 1.4 1.4L11 11zM5 4h14v2H5z"
        />
      </svg>
      Open result
      <input type="file" class="viewer-file" accept=".json,application/json" />
    </label>
  </header>
  <section class="viewer-empty">
    <p class="viewer-empty-title">No result open</p>
    <p>
      Open a saved compilation result (JSON), or drop the file anywhere on this
      page.
    </p>
  </section>
  <div class="viewer-stage"></div>
  <template class="viewer-player">{{player}}</template>
</div>
