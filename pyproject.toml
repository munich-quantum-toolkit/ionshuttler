[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mqt-ionshuttler"
version = "0.2.4"
authors = [
    { name = "Daniel Schoenberger", email = "daniel.schoenberger@tum.de"}
]
description = "A solver for the shuttling problem in QCCD quantum computers"
keywords = ["MQT", "quantum computing", "compilation", "shuttling", "design automation", "SAT solver"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = [
    "qiskit>=1.0.0",
    "numpy>=1.26",
    "numpy>=2.1; python_version >= '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "z3-solver>=4.15.3",
    "matplotlib>=3.7.1",
    "matplotlib>=3.8; python_version >= '3.12'",
    "matplotlib>=3.10; python_version >= '3.13'",
    "matplotlib>=3.10.5; python_version >= '3.14'",
    "networkx>=3.0",
    "more_itertools>=10.1.0"
]
requires-python = ">=3.10"

[project.scripts]
mqt-ionshuttler-exact = "mqt.ionshuttler.single_shuttler.__main__:main"
mqt-ionshuttler-heuristic = "mqt.ionshuttler.multi_shuttler.__main__:main"

[project.urls]
Discussions = "https://github.com/munich-quantum-toolkit/ionshuttler/discussions"
Documentation = "https://mqt.readthedocs.io/projects/ionshuttler"
Homepage = "https://github.com/munich-quantum-toolkit/ionshuttler"
Issues = "https://github.com/munich-quantum-toolkit/ionshuttler/issues"


[tool.uv]
required-version = ">=0.8.17"

[tool.uv.build-backend]
module-name = "mqt.ionshuttler"
source-include = [
  "inputs/**",
]

[tool.uv.sources]
mqt-ionshuttler = { workspace = true }


[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = [
    "-ra",
    "--showlocals",
    "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
log_level = "INFO"
filterwarnings = [
    "error",
]


[tool.coverage]
run.source = ["mqt.ionshuttler"]
run.core = "sysmon"
run.parallel = true
run.disable_warnings = [
    "no-sysmon",
]
report.exclude_also = [
    '\.\.\.',
    'if TYPE_CHECKING:',
    'raise AssertionError',
    'raise NotImplementedError',
]
show_missing = true
skip_empty = true
precision = 1


[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true

[tool.ty.src]
exclude = [
    "docs/**",
]


[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$", # ignore line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on" # ignore block
]

[tool.typos.default.extend-words]
wille = "wille"
aer = "aer"
ket   = "ket"


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
MY100 = "We use ty instead of mypy"
PC111 = "We use ruff instead of blacken-docs"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.ruff]
line-length = 120
namespace-packages = ["mqt"]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C90",
  "COM812",
  "PLR09",
  "PLR1702",
  "PLR2004",
  "RUF201",
  "S101",
  "S404",
  "TID252",
]
future-annotations = true

[tool.ruff.lint.isort]
known-first-party = ["mqt.ionshuttler"]

[tool.ruff.lint.per-file-ignores]
"src/mqt/ionshuttler/multi_shuttler/**" = [
  "ANN",
  "ARG001",
  "BLE001",
  "CPY001",
  "D",
  "DOC",
  "DTZ005",
  "E501",
  "ERA001",
  "FBT",
  "FIX002",
  "FURB",
  "NPY002",
  "PERF",
  "PLC0415",
  "PLR6301",
  "PLW0717",
  "S110",
  "S112",
  "S311",
  "SLF001",
  "T20",
  "TD",
]
"src/mqt/ionshuttler/single_shuttler/**" = [
  "ANN",
  "ARG001",
  "BLE001",
  "CPY001",
  "D",
  "DOC",
  "DTZ005",
  "E501",
  "ERA001",
  "FBT",
  "FIX002",
  "FURB",
  "NPY002",
  "PERF",
  "PLC0415",
  "PLR6301",
  "PLW0717",
  "S110",
  "S112",
  "S311",
  "SLF001",
  "T20",
  "TD",
]
"tests/*.py" = [
  "ANN",
  "BLE001",
  "CPY001",
  "D",
  "DOC",
  "ERA001",
  "FLY002",
  "PLC0415",
  "PLR6301",
  "SLF001",
]
"docs/**" = ["ANN", "CPY001", "D", "INP001", "PLR6301", "T20"]
"noxfile.py" = ["ANN", "CPY001", "D", "DOC", "PLC0415"]
"sitecustomize.py" = ["CPY001", "D"]
"src/mqt/ionshuttler/__init__.py" = ["CPY001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.check-sdist]
# uv_build 0.12 emits a TOML 1.0-normalized pyproject.toml and preserves the
# original file in source distributions, even when the source already is
# TOML 1.0.
sdist-only = ["pyproject.toml.orig"]
git-only = [
    "docs/*",
    "tests/*",
    ".gitignore",
    ".readthedocs.yaml",
    ".rumdl.toml",
    "AGENTS.md",
    "sitecustomize.py",
    "uv.lock",
]


[dependency-groups]
docs = [
    "furo>=2025.09.25",
    "graphviz>=0.21.0",
    "myst-nb>=1.3.0",
    "setuptools-scm>=9.2.2",
    "sphinx>=8.1.3",
    "sphinx>=8.2.3; python_version >= '3.11'",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-llm",
    "sphinxcontrib-bibtex>=2.6.5",
    "sphinxcontrib-svg2pdfconverter>=1.3.0",
    "sphinxext-opengraph>=0.13.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]
dev = [
    {include-group = "test"},
    "nox>=2025.11.12",
]
